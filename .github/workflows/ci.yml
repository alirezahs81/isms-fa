name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: isms
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d isms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ISMS_DB_NAME: isms
      ISMS_DB_USER: postgres
      ISMS_DB_PASSWORD: postgres
      ISMS_DB_HOST: localhost
      ISMS_DB_PORT: "5432"
      ISMS_SECRET_KEY: ci-test-secret-key-not-for-production
      ISMS_DEBUG: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Ensure static directory exists
        run: mkdir -p static

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Django system check
        run: python manage.py check

      - name: Run tests
        run: python manage.py test --verbosity=2
